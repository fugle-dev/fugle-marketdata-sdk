[workspace]
members = ["core", "py", "js", "uniffi", "rust"]
resolver = "2"

[workspace.package]
version = "3.0.0-rc.5"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fugle-dev/fugle-marketdata-sdk"
homepage = "https://developer.fugle.tw"
authors = ["Fugle Team"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
futures-util = "0.3"
url = "2.5"

# Python binding dependencies
pyo3 = { version = "0.29", default-features = false, features = ["abi3-py38", "macros"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }

# Node.js binding dependencies
napi = { version = "3.12", features = ["napi8", "async", "serde-json", "tokio_rt"] }
napi-derive = "3.6"
napi-build = "2.4"

# UniFFI binding dependencies (for C#, Go, and Java bindings)
# Pinned to 0.29.4: the highest UniFFI release every third-party generator we
# ship supports (uniffi-bindgen-cpp tops out at +v0.29.4). Scaffolding and
# generator must agree, so bump this together with the generator pins in
# .github/workflows/ci.yml and build-uniffi.yml. No `cli` feature: the repo
# uses the external uniffi-bindgen-{cs,go,cpp,java} binaries.
uniffi = { version = "=0.29.4", features = ["tokio"] }
libc = "0.2"
once_cell = "1.19"

# Core library as workspace dependency.
# `package` maps the alias `marketdata-core` to the actual published crate name.
# `version` is required for path-deps to be publishable.
marketdata-core = { path = "core", package = "fugle-marketdata-core", version = "0.9.0-rc.4" }
