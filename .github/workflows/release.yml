name: Release

# Pushing a tag `vX.Y.Z` or `vX.Y.Z-rc.N` releases the language bindings.
# The tag must equal the bindings version in js/package.json; every other
# version (PEP 440 Python, UniFFI track for C#/Go/C++) is read from its
# manifest by scripts/release-versions.py. Rust crates are published by hand
# and tagged `rust-vX.Y.Z`, which does not match this trigger's intent; the
# resolve job rejects any tag that is not the bindings version.
#
# Prereleases go to the same public registries as stable releases, but on
# channels that are never selected by default: pip needs --pre, npm uses the
# `next` dist-tag, NuGet needs --prerelease, Go needs an explicit @version.
#
# Running this workflow manually is a rehearsal: it builds every platform and
# runs each publish job up to, but not including, the upload (npm
# --dry-run, NuGet pack, Go module assembly and smoke test, PyPI wheel
# checks). Nothing is published and no GitHub Release is created. Only a tag
# push releases.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write   # GitHub Release
  packages: write   # Java to GitHub Packages (opt-in)
  id-token: write   # PyPI / npm trusted publishing, npm provenance

jobs:
  resolve:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      python_version: ${{ steps.v.outputs.python_version }}
      uniffi_version: ${{ steps.v.outputs.uniffi_version }}
      rust_version: ${{ steps.v.outputs.rust_version }}
      channel: ${{ steps.v.outputs.channel }}
      npm_tag: ${{ steps.v.outputs.npm_tag }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: mode
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      # A rehearsal has no tag, so it resolves as if tagging the current
      # bindings version.
      - id: v
        run: |
          if [[ "${{ steps.mode.outputs.dry_run }}" == "true" ]]; then
            TAG="v$(python3 -c 'import json; print(json.load(open("js/package.json"))["version"])')"
          else
            TAG="$GITHUB_REF"
          fi
          python3 scripts/release-versions.py resolve --tag "$TAG" --github-output "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            if [[ "${{ steps.mode.outputs.dry_run }}" == "true" ]]; then
              echo "## Rehearsal of ${{ steps.v.outputs.version }} (${{ steps.v.outputs.channel }}) — nothing will be published"
            else
              echo "## Release ${{ steps.v.outputs.version }} (${{ steps.v.outputs.channel }})"
            fi
            echo ""
            echo "| Track | Version |"
            echo "|---|---|"
            echo "| Python | ${{ steps.v.outputs.python_version }} |"
            echo "| Node.js | ${{ steps.v.outputs.version }} (npm tag \`${{ steps.v.outputs.npm_tag }}\`) |"
            echo "| C# / Go / C++ | ${{ steps.v.outputs.uniffi_version }} |"
            echo "| Rust core (built against) | ${{ steps.v.outputs.rust_version }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==============================================================
  # Wave 1: build every platform
  # ==============================================================
  build-python:
    name: Build Python wheels
    needs: resolve
    uses: ./.github/workflows/build-python.yml
    with:
      version: ${{ needs.resolve.outputs.version }}

  build-nodejs:
    name: Build Node.js addons
    needs: resolve
    uses: ./.github/workflows/build-nodejs.yml
    with:
      version: ${{ needs.resolve.outputs.version }}

  build-uniffi:
    name: Build UniFFI native libraries
    needs: resolve
    uses: ./.github/workflows/build-uniffi.yml
    with:
      # C++ has no package registry; the Release tarballs are its only
      # distribution channel, so build it for every release.
      include_cpp: true

  # ==============================================================
  # Wave 2: publish to registries
  # ==============================================================

  # Inline rather than a reusable workflow: PyPI trusted publishing does not
  # accept reusable workflows (pypi/warehouse#11096). Register this file,
  # `release.yml`, with environment `release` as the trusted publisher.
  publish-python:
    name: Publish to PyPI
    needs: [resolve, build-python]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/fugle-marketdata/${{ needs.resolve.outputs.python_version }}/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Verify wheels
        env:
          PY_VERSION: ${{ needs.resolve.outputs.python_version }}
        run: |
          ls -la dist/
          COUNT=$(ls dist/*.whl | wc -l | tr -d ' ')
          # linux x86_64, linux aarch64, macOS x86_64, macOS arm64, Windows x64
          [[ "$COUNT" == "5" ]] || { echo "::error::Expected 5 wheels, found $COUNT"; exit 1; }
          for w in dist/*.whl; do
            [[ "$(basename "$w")" == fugle_marketdata-${PY_VERSION}-* ]] || { echo "::error::$w is not version $PY_VERSION"; exit 1; }
          done
          echo "| Wheel |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|" >> "$GITHUB_STEP_SUMMARY"
          for w in dist/*.whl; do echo "| $(basename "$w") |" >> "$GITHUB_STEP_SUMMARY"; done

      - name: Check package metadata
        run: pipx run twine check --strict dist/*

      - name: Publish
        if: needs.resolve.outputs.dry_run != 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

  publish-nodejs:
    name: Publish to npm
    needs: [resolve, build-nodejs]
    uses: ./.github/workflows/publish-nodejs.yml
    with:
      npm_tag: ${{ needs.resolve.outputs.npm_tag }}
      dry-run: ${{ needs.resolve.outputs.dry_run == 'true' }}
    secrets: inherit

  publish-nuget:
    name: Publish to NuGet
    needs: [resolve, build-uniffi]
    uses: ./.github/workflows/publish-nuget.yml
    with:
      version: ${{ needs.resolve.outputs.uniffi_version }}
      dry-run: ${{ needs.resolve.outputs.dry_run == 'true' }}
    secrets: inherit

  publish-go:
    name: Publish Go module
    needs: [resolve, build-uniffi]
    uses: ./.github/workflows/publish-go.yml
    with:
      version: ${{ needs.resolve.outputs.uniffi_version }}
      dry-run: ${{ needs.resolve.outputs.dry_run == 'true' }}
    secrets: inherit

  # Java is not distributed yet: the JNA callback path benchmarks at roughly
  # a tenth of the other bindings (benchmarks/ws/REPORT.md). Set the
  # repository variable PUBLISH_JAVA=true to opt back in.
  publish-java:
    name: Publish Java to GitHub Packages
    needs: [resolve, build-uniffi]
    if: vars.PUBLISH_JAVA == 'true' && needs.resolve.outputs.dry_run != 'true'
    uses: ./.github/workflows/publish-java.yml
    with:
      version: ${{ needs.resolve.outputs.uniffi_version }}

  # ==============================================================
  # C++ tarballs (attached to the GitHub Release)
  # ==============================================================
  pack-cpp:
    name: Package C++ tarballs
    needs: [resolve, build-uniffi]
    runs-on: ubuntu-latest
    steps:
      # Single download covers both the per-platform dylibs (uniffi-cpp-<target>)
      # and the shared headers artifact (uniffi-cpp-headers). Each lands in its
      # own subdirectory under cpp-libs/ keyed by artifact name.
      - name: Download all cpp-feature artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: uniffi-cpp-*
          path: cpp-libs/

      - name: List downloads
        run: find cpp-libs -type f

      - name: Assemble tarballs
        env:
          VERSION: ${{ needs.resolve.outputs.uniffi_version }}
        run: |
          mkdir -p cpp-dist
          # Map rid → source artifact dir + lib filename pattern
          for entry in \
              "linux-x64:uniffi-cpp-x86_64-unknown-linux-gnu:libmarketdata_uniffi.so" \
              "osx-arm64:uniffi-cpp-aarch64-apple-darwin:libmarketdata_uniffi.dylib" \
              "osx-x64:uniffi-cpp-x86_64-apple-darwin:libmarketdata_uniffi.dylib" \
              "win-x64:uniffi-cpp-x86_64-pc-windows-msvc:marketdata_uniffi.dll"; do
            rid="${entry%%:*}"
            rest="${entry#*:}"
            artifact="${rest%%:*}"
            libfile="${rest#*:}"
            stage="fugle-marketdata-cpp-${rid}-${VERSION}"
            mkdir -p "$stage/include" "$stage/lib"
            cp cpp-libs/uniffi-cpp-headers/marketdata_uniffi.hpp "$stage/include/"
            cp cpp-libs/uniffi-cpp-headers/marketdata_uniffi.cpp "$stage/include/"
            cp "cpp-libs/${artifact}/${libfile}" "$stage/lib/"
            cat > "$stage/README.md" <<EOF
          # fugle-marketdata-cpp ${VERSION} / ${rid}

          See docs/INSTALL.md#c for full setup. TL;DR:

              c++ -std=c++20 -Iinclude \\
                  include/marketdata_uniffi.cpp my_app.cpp \\
                  -Llib -lmarketdata_uniffi \\
                  -o my_app

          On macOS: export DYLD_LIBRARY_PATH=\$(pwd)/lib:\$DYLD_LIBRARY_PATH
          On Linux: export LD_LIBRARY_PATH=\$(pwd)/lib:\$LD_LIBRARY_PATH
          On Windows: add lib to PATH and use \`marketdata_uniffi.dll\`
          EOF
            tar -czf "cpp-dist/${stage}.tar.gz" -C "$(dirname "$stage")" "$(basename "$stage")"
            rm -rf "$stage"
          done
          ls -la cpp-dist/

      - name: Upload as internal artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-cpp
          path: cpp-dist/*.tar.gz
          retention-days: 5


  # ==============================================================
  # Wave 3: GitHub Release
  # ==============================================================
  # Created only when every publish job succeeded (or was skipped), so a
  # Release page never advertises packages that are not installable. Publish
  # steps are idempotent; re-run failed jobs to finish a partial release.
  create-release:
    name: Create GitHub Release
    needs: [resolve, publish-python, publish-nodejs, publish-nuget, publish-go, publish-java, pack-cpp]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.resolve.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download C++ tarballs
        uses: actions/download-artifact@v4
        with:
          name: release-cpp
          path: release-assets/

      - name: Generate release notes
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PY: ${{ needs.resolve.outputs.python_version }}
          UNIFFI: ${{ needs.resolve.outputs.uniffi_version }}
          RUST: ${{ needs.resolve.outputs.rust_version }}
          NPM_TAG: ${{ needs.resolve.outputs.npm_tag }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$CHANNEL" == "prerelease" ]]; then
            PIP_PRE="--pre "; NUGET_PRE=" --prerelease"
            BANNER="> **Pre-release.** Package managers do not pick this up by default: pip needs \`--pre\`, npm uses the \`next\` tag, NuGet needs \`--prerelease\`, Go needs an explicit version."
          else
            PIP_PRE=""; NUGET_PRE=""; BANNER=""
          fi
          cat > notes.md <<EOF
          ## Fugle Market Data SDK ${VERSION}

          ${BANNER}

          | Language | Package | Version | Install |
          |---|---|---|---|
          | Python | [\`fugle-marketdata\`](https://pypi.org/project/fugle-marketdata/${PY}/) | ${PY} | \`pip install ${PIP_PRE}"fugle-marketdata==${PY}"\` |
          | Node.js | [\`@fugle/marketdata\`](https://www.npmjs.com/package/@fugle/marketdata/v/${VERSION}) | ${VERSION} | \`npm install @fugle/marketdata@${NPM_TAG}\` |
          | C# | [\`Fugle.MarketData\`](https://www.nuget.org/packages/Fugle.MarketData/${UNIFFI}) | ${UNIFFI} | \`dotnet add package Fugle.MarketData --version ${UNIFFI}\` |
          | Go | [\`github.com/fugle-dev/fugle-marketdata-go\`](https://pkg.go.dev/github.com/fugle-dev/fugle-marketdata-go@v${UNIFFI}) | v${UNIFFI} | \`go get github.com/fugle-dev/fugle-marketdata-go@v${UNIFFI}\` |
          | C++ | tarballs attached below | ${UNIFFI} | see [docs/INSTALL.md](https://github.com/${REPO}/blob/${SHA}/docs/INSTALL.md#c) |

          Built against Rust core \`fugle-marketdata-core\` ${RUST}. Rust crates are released separately on crates.io.

          See [CHANGELOG.md](https://github.com/${REPO}/blob/${SHA}/CHANGELOG.md) for details.
          EOF
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ needs.resolve.outputs.channel == 'prerelease' }}
          make_latest: ${{ needs.resolve.outputs.channel == 'stable' }}
          files: release-assets/*

  rehearsal-summary:
    name: Rehearsal summary
    needs: [resolve, publish-python, publish-nodejs, publish-nuget, publish-go, pack-cpp]
    if: ${{ always() && needs.resolve.outputs.dry_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarise
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Rehearsal results"
            echo ""
            echo "Nothing was published and no GitHub Release was created."
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "$RESULTS" | python3 -c 'import json,sys; [print("| %s | %s |" % (k, v["result"])) for k,v in json.load(sys.stdin).items()]'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | python3 -c 'import json,sys; bad=[k for k,v in json.load(sys.stdin).items() if v["result"]!="success"]; print("failed:",bad) if bad else None; sys.exit(1 if bad else 0)'
