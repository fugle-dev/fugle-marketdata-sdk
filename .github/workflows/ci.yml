name: CI

# Runs on every pull request and on main. Linux only to keep it fast; the
# full OS x language matrix lives in test.yml (manual) and the post-release
# install matrix in verify-release.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  versions:
    name: Version tracks
    uses: ./.github/workflows/version-check.yml

  rust:
    name: Rust (clippy, tests, publish dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust

      - name: Clippy
        run: >
          cargo clippy --locked --all-targets --all-features
          -p fugle-marketdata-core -p fugle-marketdata -p marketdata-uniffi -p marketdata-py -p marketdata-js
          -- -D warnings

      - name: Test core and facade
        run: |
          cargo test --locked --all-features -p fugle-marketdata-core
          cargo test --locked -p fugle-marketdata

      - name: Test UniFFI crate
        run: cargo test --locked -p marketdata-uniffi

      # Packages and verifies both crates together, so the facade resolves
      # the unpublished core version from the local package.
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked -p fugle-marketdata-core -p fugle-marketdata

  # Release artifacts (wheels, npm addons, NuGet, Go static libraries) are
  # built from Cargo.lock, so a vulnerable locked dependency ships to users.
  # Fails on vulnerabilities; unmaintained/unsound notices are reported only.
  audit:
    name: Security advisories (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo-audit
        id: audit-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit

  # Libraries do not ship Cargo.lock, so the MSRV contract is "some
  # dependency set builds on rust-version", not "our lockfile builds on it".
  # Resolve an MSRV-compatible lockfile with the MSRV-aware resolver, then
  # build with the declared toolchain.
  msrv:
    name: Rust MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-msrv
      - name: Resolve MSRV-compatible dependencies
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: cargo +stable generate-lockfile
      - run: cargo +1.88 build --locked --all-features -p fugle-marketdata-core -p fugle-marketdata

  python:
    name: Python binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test
        working-directory: py
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest pytest-asyncio pytest-timeout
          maturin develop
          pytest -q -k "not integration" tests --ignore=tests/benchmarks --ignore=tests/test_performance.py

  nodejs:
    name: Node.js binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-nodejs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test
        working-directory: js
        run: |
          npm ci
          npm run build:debug
          npx jest --ci --testPathIgnorePatterns=integration --testPathIgnorePatterns=performance --testPathIgnorePatterns=benchmarks
      - name: Type declarations match the wire format
        working-directory: js
        run: npm run check:dts
      - name: Type declarations parse
        working-directory: js
        run: npx tsc --noEmit --strict --skipLibCheck index.d.ts types.d.ts
      - name: Generated loader and types are committed
        run: git diff --exit-code -- js/index.js js/index.d.ts

  # Also checks the Java and C++ generated sources. The job name stays as-is
  # because it is a required status check on main.
  uniffi:
    name: UniFFI bindings (C#, Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-uniffi
      - uses: actions/setup-dotnet@v4
        with:
          # The library multi-targets net10.0, so restoring anything that
          # references it needs the .NET 10 SDK; tests run on net8.0.
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # uniffi-bindgen-cpp needs the library built with the `cpp` feature
      # (async methods stripped). Build it first and move it aside: the plain
      # build below then overwrites target/release for C#, Go and Java, while
      # both builds share the cached dependencies.
      - name: Build native library (cpp feature)
        run: |
          cargo build --locked --release -p marketdata-uniffi --features cpp
          mkdir -p "$RUNNER_TEMP/cpp"
          cp target/release/libmarketdata_uniffi.so "$RUNNER_TEMP/cpp/"

      - name: Build native library
        run: cargo build --locked --release -p marketdata-uniffi

      # The C#, Go, Java and C++ sources generated by UniFFI are committed and
      # shipped as-is. If they drift from the Rust interface, every client
      # construction fails with a checksum mismatch at load time.
      - name: Cache bindgen tools
        id: bindgen-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/uniffi-bindgen-cs
            ~/.cargo/bin/uniffi-bindgen-go
            ~/.cargo/bin/uniffi-bindgen-java
            ~/.cargo/bin/uniffi-bindgen-cpp
          key: bindgen-cs-v0.10.0+v0.29.4-go-v0.5.0+v0.29.5-java-0.2.1-cpp-v0.9.0+v0.29.4-${{ runner.os }}
      - name: Install bindgen tools
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: |
          cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.10.0+v0.29.4
          cargo install uniffi-bindgen-go --git https://github.com/NordSecurity/uniffi-bindgen-go --tag v0.5.0+v0.29.5
          cargo install uniffi-bindgen-java --git https://github.com/IronCoreLabs/uniffi-bindgen-java --tag 0.2.1 --locked
          cargo install uniffi-bindgen-cpp --git https://github.com/NordSecurity/uniffi-bindgen-cpp --tag v0.9.0+v0.29.4
      # uniffi-bindgen-cs formats its output with CSharpier when it is on
      # PATH, so the formatter version is part of the generated file. The
      # generator only warns if CSharpier is missing, and the diff below then
      # fails. v0.10 calls the CSharpier 1.x CLI (`csharpier format`).
      - name: Install CSharpier
        run: dotnet tool install -g csharpier --version 1.3.0
      - name: Generated bindings are up to date
        run: |
          make gen-csharp gen-go UNIFFI_LIB=target/release/libmarketdata_uniffi.so
          git diff --exit-code -- bindings/csharp/MarketdataUniffi/marketdata_uniffi.cs bindings/go/marketdata/ \
            || { echo "::error::UniFFI bindings are stale. Run 'make gen-csharp gen-go' and commit the result."; exit 1; }

      # The generated directories are wiped before regenerating, and compared
      # with `git status` rather than `git diff`, so files the generator no
      # longer emits (deleted) or newly emits (untracked) fail the check too.
      - name: Generated Java bindings are up to date
        run: |
          gen=bindings/java/src/main/java/tw/com/fugle/marketdata/generated
          rm -rf "$gen"
          make gen-java UNIFFI_LIB=target/release/libmarketdata_uniffi.so
          if [ -n "$(git status --porcelain -- bindings/java/src/main/java/)" ]; then
            git status --short -- bindings/java/src/main/java/
            git diff -- bindings/java/src/main/java/
            echo "::error::Java UniFFI bindings are stale or hand-edited. Run 'make gen-java' and commit the result."
            exit 1
          fi

      # Calls the generator directly: `make gen-cpp` would rebuild with the
      # cpp feature into target/release, replacing the library the C# and Go
      # tests below load.
      - name: Generated C++ bindings are up to date
        run: |
          rm -rf bindings/cpp
          mkdir -p bindings/cpp
          uniffi-bindgen-cpp --library "$RUNNER_TEMP/cpp/libmarketdata_uniffi.so" -o bindings/cpp/
          if [ -n "$(git status --porcelain -- bindings/cpp/)" ]; then
            git status --short -- bindings/cpp/
            git diff -- bindings/cpp/
            echo "::error::C++ UniFFI bindings are stale or hand-edited. Run 'make gen-cpp' and commit the result."
            exit 1
          fi

      # Without the native library on the loader path every test that builds
      # a client hits Assert.Inconclusive and silently skips — 36 of 55 used
      # to do exactly that, so most of this suite never ran in CI.
      - name: C# tests
        working-directory: bindings/csharp
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: dotnet test MarketdataUniffi.Tests --filter "Category!=Integration&TestCategory!=Integration"

      # Most C# tests skip when the native library is absent, so load it for
      # real once.
      - name: C# native load
        run: |
          dotnet new console --framework net8.0 -o /tmp/cs-smoke
          dotnet add /tmp/cs-smoke reference bindings/csharp/MarketdataUniffi/MarketdataUniffi.csproj
          cat > /tmp/cs-smoke/Program.cs <<'CS'
          using FugleMarketData;
          using var client = new RestClient(new RestClientOptions { ApiKey = "smoke-test-token" });
          if (client.Stock == null || client.FutOpt == null) throw new System.Exception("missing REST accessors");
          System.Console.WriteLine("OK");
          CS
          LD_LIBRARY_PATH="$PWD/target/release" dotnet run --project /tmp/cs-smoke

      - name: Go tests
        working-directory: bindings/go/marketdata
        env:
          CGO_ENABLED: '1'
        run: go test -short ./...

  # Compiles the Java sources (including examples/, which build.gradle.kts puts
  # in the main source set) and runs the tests that do not need the native
  # library; tests that construct a client skip here. java.yml / test.yml keep
  # the full native-library test matrix behind workflow_dispatch.
  java:
    name: Java binding (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - name: Compile sources, examples and tests
        working-directory: bindings/java
        run: ./gradlew compileJava compileTestJava --no-daemon
      - name: Structural tests (no native library)
        working-directory: bindings/java
        run: ./gradlew test -PexcludeTags=integration --no-daemon
