name: Documentation Validation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'migration/**'
      - 'examples/**'
      - '.markdownlint.json'
      - '.markdown-link-check.json'
      - '.github/workflows/docs-validation.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'migration/**'
      - 'examples/**'
      - '.markdownlint.json'
      - '.markdown-link-check.json'
      - '.github/workflows/docs-validation.yml'

jobs:
  validate-docs:
    name: Validate Documentation Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned: new markdownlint releases add rules (e.g. MD060), which would
      # turn unrelated pull requests red overnight.
      - name: Install documentation tools
        run: |
          npm install -g markdownlint-cli@0.45.0 markdown-link-check@3.13.7

      - name: Lint Markdown files
        run: |
          markdownlint \
            '*.md' \
            'docs/**/*.md' \
            'py/README.md' \
            'js/README.md' \
            'core/README.md' \
            'uniffi/README.md' \
            --ignore node_modules \
            --ignore .planning \
            --ignore target \
            --config .markdownlint.json

      - name: Check for deprecated API patterns
        run: |
          chmod +x migration/validate-migration.sh
          ./migration/validate-migration.sh

      - name: Check documentation links
        run: |
          # Check key documentation files for broken links
          if [ -f MIGRATION.md ]; then
            markdown-link-check MIGRATION.md --config .markdown-link-check.json
          fi
          if [ -f docs/configuration.md ]; then
            markdown-link-check docs/configuration.md --config .markdown-link-check.json
          fi
          if [ -f CHANGELOG.md ]; then
            markdown-link-check CHANGELOG.md --config .markdown-link-check.json
          fi
        continue-on-error: true
