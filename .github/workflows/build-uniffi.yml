name: Build UniFFI Native Libraries

on:
  workflow_call:
    inputs:
      include_cpp:
        description: 'Also build the cpp feature variant (for internal C++ distribution)'
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: "UniFFI binding version from uniffi/Cargo.toml"
        value: ${{ jobs.consolidate.outputs.version }}
  workflow_dispatch:
    inputs:
      include_cpp:
        description: 'Also build the cpp feature variant'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Default-feature matrix — always runs, powers C#/Java/Go publish paths
  # and the Go internal tarball. Produces uniffi-default-<target> artifacts.
  build:
    name: Build UniFFI default (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: libmarketdata_uniffi.so
            rid: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            lib: libmarketdata_uniffi.dylib
            rid: osx-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            lib: libmarketdata_uniffi.dylib
            rid: osx-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib: marketdata_uniffi.dll
            rid: win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: uniffi-default-release

      # cargo-zigbuild links Linux targets against an older glibc.
      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        run: pip install --user cargo-zigbuild==0.23.4 ziglang==0.15.1

      - name: Build UniFFI cdylib
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cargo zigbuild --release -p marketdata-uniffi --target ${{ matrix.target }}.2.17
          else
            cargo build --release -p marketdata-uniffi --target ${{ matrix.target }}
          fi

      # Linux libraries are linked against glibc 2.17 (same baseline as the
      # manylinux2014 Python wheels) so they load on older distributions such
      # as RHEL 8, Debian 11 and Amazon Linux 2.
      - name: Verify glibc baseline
        if: runner.os == 'Linux'
        run: |
          lib=target/${{ matrix.target }}/release/${{ matrix.lib }}
          max=$(readelf -V "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -V -u | tail -1)
          echo "$lib requires $max"
          [[ "$(printf '%s\n' "$max" GLIBC_2.17 | sort -V | tail -1)" == "GLIBC_2.17" ]] \
            || { echo "::error::$lib requires $max, expected <= GLIBC_2.17"; exit 1; }

      - name: Upload native library artifact
        uses: actions/upload-artifact@v4
        with:
          name: uniffi-default-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.lib }}
          retention-days: 5

  # cpp-feature matrix — only runs on internal release channel. Produces
  # uniffi-cpp-<target> artifacts + one uniffi-cpp-headers artifact (the C++
  # bindings are platform-independent, so bindgen runs once on Linux x64).
  #
  # Separate rust-cache shared-key avoids thrashing against the default build
  # (feature flags invalidate cargo incremental artifacts).
  build-cpp:
    name: Build UniFFI cpp (${{ matrix.target }})
    if: ${{ inputs.include_cpp }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: libmarketdata_uniffi.so
            rid: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            lib: libmarketdata_uniffi.dylib
            rid: osx-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            lib: libmarketdata_uniffi.dylib
            rid: osx-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib: marketdata_uniffi.dll
            rid: win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: uniffi-cpp-release

      # cargo-zigbuild links Linux targets against an older glibc.
      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        run: pip install --user cargo-zigbuild==0.23.4 ziglang==0.15.1

      - name: Build UniFFI cdylib (cpp feature)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cargo zigbuild --release -p marketdata-uniffi --features cpp --target ${{ matrix.target }}.2.17
          else
            cargo build --release -p marketdata-uniffi --features cpp --target ${{ matrix.target }}
          fi

      # Linux libraries are linked against glibc 2.17 (same baseline as the
      # manylinux2014 Python wheels) so they load on older distributions such
      # as RHEL 8, Debian 11 and Amazon Linux 2.
      - name: Verify glibc baseline
        if: runner.os == 'Linux'
        run: |
          lib=target/${{ matrix.target }}/release/${{ matrix.lib }}
          max=$(readelf -V "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -V -u | tail -1)
          echo "$lib requires $max"
          [[ "$(printf '%s\n' "$max" GLIBC_2.17 | sort -V | tail -1)" == "GLIBC_2.17" ]] \
            || { echo "::error::$lib requires $max, expected <= GLIBC_2.17"; exit 1; }

      - name: Upload native library artifact
        uses: actions/upload-artifact@v4
        with:
          name: uniffi-cpp-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.lib }}
          retention-days: 5

      # Generate C++ headers once — output is platform-independent.
      - name: Install uniffi-bindgen-cpp
        if: matrix.rid == 'linux-x64'
        run: cargo install uniffi-bindgen-cpp --git https://github.com/NordSecurity/uniffi-bindgen-cpp --tag v0.9.0+v0.29.4

      - name: Generate C++ bindings
        if: matrix.rid == 'linux-x64'
        run: |
          mkdir -p bindings/cpp
          uniffi-bindgen-cpp \
            --library target/${{ matrix.target }}/release/${{ matrix.lib }} \
            -o bindings/cpp/

      - name: Upload C++ header artifact
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: uniffi-cpp-headers
          path: bindings/cpp/
          retention-days: 5

  # Go static-library matrix — powers the standalone Go module published to
  # github.com/fugle-dev/fugle-marketdata-go. Kept apart from `build` because
  # scripts/build-go-static-lib.sh uses a fat-LTO profile in its own target dir
  # (target/go-static); sharing a job or cache with the cdylib build would
  # rebuild every dependency twice.
  build-go-static:
    name: Build Go static lib (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin_arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin_amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
          # Go on Windows links cgo with mingw-w64 gcc, which cannot consume
          # MSVC archives, so this target is cross-compiled with mingw.
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            platform: windows_amd64
            mingw: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/go-static"
          shared-key: go-static-${{ matrix.target }}

      - name: Install mingw-w64 (Windows cross build)
        if: matrix.mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build static library
        shell: bash
        env:
          CC_x86_64_pc_windows_gnu: ${{ matrix.mingw && 'x86_64-w64-mingw32-gcc' || '' }}
          AR_x86_64_pc_windows_gnu: ${{ matrix.mingw && 'x86_64-w64-mingw32-ar' || '' }}
        run: scripts/build-go-static-lib.sh ${{ matrix.target }} ${{ matrix.platform }} go-static

      - name: Upload static library artifact
        uses: actions/upload-artifact@v4
        with:
          name: uniffi-go-static-${{ matrix.platform }}
          path: go-static/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 5

  consolidate-go-static:
    name: Consolidate Go Static Libraries
    needs: build-go-static
    runs-on: ubuntu-latest

    steps:
      - name: Download per-platform static libraries
        uses: actions/download-artifact@v4
        with:
          pattern: uniffi-go-static-*
          path: downloads/

      - name: Arrange as <goos>_<goarch>/ and verify
        run: |
          mkdir -p uniffi-go-static
          for platform in darwin_arm64 darwin_amd64 linux_amd64 windows_amd64; do
            src="downloads/uniffi-go-static-${platform}"
            if [[ ! -f "$src/libmarketdata_uniffi.a" || ! -s "$src/native-static-libs.txt" ]]; then
              echo "::error::Missing static library or native-static-libs.txt for ${platform}"
              ls -la "$src" 2>/dev/null || true
              exit 1
            fi
            mv "$src" "uniffi-go-static/${platform}"
          done

          echo "## Go static libraries" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|------|" >> $GITHUB_STEP_SUMMARY
          for f in uniffi-go-static/*/*.a; do
            platform=$(basename "$(dirname "$f")")
            echo "| ${platform} | $(basename "$f") | $(ls -lh "$f" | awk '{print $5}') |" >> $GITHUB_STEP_SUMMARY
          done
          find uniffi-go-static -type f -exec ls -l {} \;

      - name: Upload consolidated artifact
        uses: actions/upload-artifact@v4
        with:
          name: uniffi-go-static
          path: uniffi-go-static/
          retention-days: 5

  consolidate:
    name: Consolidate Native Libraries
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      # The UniFFI bindings (C#, Go, Java, C++) follow their own 0.x track,
      # declared explicitly in uniffi/Cargo.toml rather than inherited from
      # the workspace version that py/js use.
      - name: Extract version from uniffi/Cargo.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version' uniffi/Cargo.toml | cut -d'"' -f2)
          if [[ -z "$VERSION" ]]; then
            echo "::error file=uniffi/Cargo.toml::Could not read package version"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "UniFFI binding version: $VERSION"

      - name: Download Linux x64 artifact (default)
        uses: actions/download-artifact@v4
        with:
          name: uniffi-default-x86_64-unknown-linux-gnu
          path: uniffi-all/linux-x64/

      - name: Download macOS ARM64 artifact (default)
        uses: actions/download-artifact@v4
        with:
          name: uniffi-default-aarch64-apple-darwin
          path: uniffi-all/osx-arm64/

      - name: Download macOS x64 artifact (default)
        uses: actions/download-artifact@v4
        with:
          name: uniffi-default-x86_64-apple-darwin
          path: uniffi-all/osx-x64/

      - name: Download Windows x64 artifact (default)
        uses: actions/download-artifact@v4
        with:
          name: uniffi-default-x86_64-pc-windows-msvc
          path: uniffi-all/win-x64/

      - name: Verify consolidated structure
        run: |
          echo "Consolidated native libraries:"
          find uniffi-all -type f -exec ls -lh {} \;

          echo ""
          echo "Verifying required libraries exist..."
          test -f uniffi-all/linux-x64/libmarketdata_uniffi.so || exit 1
          test -f uniffi-all/osx-arm64/libmarketdata_uniffi.dylib || exit 1
          test -f uniffi-all/osx-x64/libmarketdata_uniffi.dylib || exit 1
          test -f uniffi-all/win-x64/marketdata_uniffi.dll || exit 1
          echo "All required libraries present."

      - name: Upload consolidated artifact
        uses: actions/upload-artifact@v4
        with:
          name: uniffi-all
          path: uniffi-all/
          retention-days: 5
