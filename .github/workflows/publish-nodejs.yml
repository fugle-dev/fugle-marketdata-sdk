name: Publish Node.js to npm

# Publishes @fugle/marketdata plus one optional-dependency package per
# platform (@fugle/marketdata-<platform>). Platform packages go first so the
# main package never points at binaries that are not on the registry yet.
#
# Auth: npm trusted publishing (OIDC) when configured on npmjs.com, otherwise
# the NPM_TOKEN secret. npm validates the *calling* workflow, so register
# `release.yml` (not this file) as the trusted publisher.
on:
  workflow_call:
    inputs:
      npm_tag:
        description: 'npm dist-tag: `next` for prereleases, `latest` for stable'
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      npm_tag:
        description: 'npm dist-tag'
        required: true
        type: choice
        options: [next, latest]
        default: next
      dry-run:
        description: 'Pack and validate only, do not publish'
        required: false
        type: boolean
        default: true

jobs:
  publish:
    name: Publish to npm (${{ inputs.npm_tag }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publishing + provenance
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@^11.5.1 && npm --version

      # setup-node's registry-url writes
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # into .npmrc. With no NPM_TOKEN secret that expands to an empty
      # `_authToken=`, and npm treats the mere presence of the line as "auth is
      # configured" — so it never starts the OIDC exchange and the publish
      # fails as unauthenticated. See actions/setup-node#1551.
      #
      # `npm publish --dry-run` does not authenticate, so a rehearsal cannot
      # catch this; strip the line whenever there is no token to put in it.
      - name: Clear placeholder auth line when publishing over OIDC
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            echo "NPM_TOKEN is set; keeping token auth." && exit 0
          fi
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [[ -f "$npmrc" ]]; then
            grep -v '_authToken' "$npmrc" > "$npmrc.tmp" || true
            mv "$npmrc.tmp" "$npmrc"
            # Confirm rather than assume: a silently failed edit here would
            # surface as an authentication error mid-publish.
            if grep -q '_authToken' "$npmrc"; then
              echo "::error::Could not remove the placeholder _authToken line from $npmrc"
              exit 1
            fi
          fi
          echo "Publishing over OIDC; no token auth line in $npmrc."

      # Release policy: only release candidates (X.Y.Z-rc.N) may be published. See scripts/release-versions.py.
      # Release candidates go to `next` only, never `latest`.
      - name: Guard version and dist-tag
        run: |
          VERSION=$(node -p "require('./js/package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] \
            || { echo "::error::$VERSION is not a release candidate; only X.Y.Z-rc.N may be published"; exit 1; }
          [[ "${{ inputs.npm_tag }}" == "next" ]] \
            || { echo "::error::Release candidates are published to the next dist-tag only, not ${{ inputs.npm_tag }}"; exit 1; }

      - name: Download binding artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: js/artifacts/

      - name: Install dependencies
        working-directory: js
        run: npm ci

      # create-npm-dirs + artifacts + pre-publish lay out npm/<platform>/ and
      # stamp versions and optionalDependencies. --skip-optional-publish and
      # --no-gh-release stop napi from publishing or creating a GitHub
      # release on its own; publishing happens explicitly below with the
      # right dist-tag.
      - name: Assemble platform packages
        working-directory: js
        run: |
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts
          npx napi pre-publish -t npm --no-gh-release --skip-optional-publish
          # napi artifacts also copies every binary into js/; the main
          # package's `files` glob would otherwise ship all of them.
          rm -f ./*.node

      - name: Verify packages
        working-directory: js
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED=$(node -p "Object.keys(require('./package.json').optionalDependencies).length")
          FOUND=0
          echo "| Package | Version | Binary |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for dir in npm/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            bins=$(find "$dir" -maxdepth 1 -name '*.node' | wc -l | tr -d ' ')
            echo "| $name | $ver | $bins |" >> "$GITHUB_STEP_SUMMARY"
            [[ "$ver" == "$VERSION" ]] || { echo "::error::$name version $ver != $VERSION"; exit 1; }
            [[ "$bins" == "1" ]] || { echo "::error::$name has $bins .node files, expected 1"; exit 1; }
            FOUND=$((FOUND + 1))
          done
          [[ "$FOUND" == "$EXPECTED" ]] || { echo "::error::Found $FOUND platform packages, package.json lists $EXPECTED"; exit 1; }
          ls ./*.node 2>/dev/null && { echo "::error::Stray .node files in js/"; exit 1; } || true

      # Runs in a rehearsal too. `npm publish --dry-run` only packs — it never
      # contacts the registry — so a rehearsal cannot tell whether trusted
      # publishing is configured. Each of the eight packages carries its own
      # trusted-publisher config and any one of them being unset fails the
      # real release halfway through, after some packages are already live.
      # Exchanging an OIDC token per package proves all eight up front; the
      # tokens are short-lived and discarded here.
      - name: Verify trusted publishers (OIDC)
        working-directory: js
        run: |
          set -euo pipefail
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          [[ -n "$OIDC" && "$OIDC" != "null" ]] || {
            echo "::error::Could not obtain a GitHub OIDC token"; exit 1; }

          FAILED=0
          echo "| Package | Trusted publisher |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for dir in npm/*/ .; do
            name=$(node -p "require('./$dir/package.json').name")
            enc=${name//\//%2F}   # @fugle/marketdata -> @fugle%2Fmarketdata
            RESP=$(curl -sS -X POST -H "Authorization: Bearer $OIDC" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$enc")
            TOKEN=$(jq -r '.token // empty' <<<"$RESP" 2>/dev/null || true)
            if [[ -n "$TOKEN" ]]; then
              echo "::add-mask::$TOKEN"
              echo "| \`$name\` | ok |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$name\` | **not configured** |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::npm rejected the OIDC token for $name. Add a trusted \
          publisher on npmjs.com (Settings -> Trusted publishing) for repository \
          ${{ github.repository }}, workflow 'release.yml', environment blank."
              FAILED=1
            fi
          done
          [[ "$FAILED" == "0" ]]

      - name: Publish
        working-directory: js
        env:
          # Empty when publishing over OIDC; npm then falls back to the
          # trusted-publisher exchange.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.npm_tag }}
          DRY_RUN: ${{ inputs.dry-run }}
          # Provenance is only generated for public repositories, and a dry run
          # has nothing to attest.
          PROVENANCE: ${{ !inputs.dry-run && github.event.repository.private == false && '--provenance' || '' }}
        run: |
          set -euo pipefail
          FLAGS=(--access public --tag "$NPM_TAG")
          [[ -n "$PROVENANCE" ]] && FLAGS+=("$PROVENANCE")
          [[ "$DRY_RUN" == "true" ]] && FLAGS+=(--dry-run)

          publish() {  # $1 = package dir, remaining = extra flags
            local dir="$1"; shift
            local name ver
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "::notice::$name@$ver already on npm, skipping"
              return
            fi
            (cd "$dir" && npm publish "${FLAGS[@]}" "$@")
          }

          for dir in npm/*/; do publish "${dir%/}"; done
          # --ignore-scripts: prepublishOnly runs `napi prepublish`, which
          # would try to publish the platform packages again without a tag.
          publish . --ignore-scripts
          echo "Published @fugle/marketdata with dist-tag \`$NPM_TAG\`$([[ "$DRY_RUN" == "true" ]] && echo ' (dry run)')" >> "$GITHUB_STEP_SUMMARY"
