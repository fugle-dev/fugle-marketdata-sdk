name: Build Node.js Native Addon

on:
  workflow_call:
    inputs:
      version:
        description: 'SemVer version (e.g., 3.0.0 or 3.0.0-rc.10). Injected into package.json before napi build.'
        required: true
        type: string
    outputs:
      version:
        description: 'Resolved version used for artifact naming'
        value: ${{ jobs.version.outputs.version }}
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for artifact naming'
        required: false
        type: string
        default: 'dev'

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build version
        id: version
        run: |
          TAG="${{ inputs.version }}"
          if [[ -z "$TAG" || "$TAG" == "dev" ]]; then
            # Manual workflow_dispatch fallback
            TAG=$(node -p "require('./js/package.json').version")
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved npm version: $TAG"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            node_file: marketdata-js.darwin-x64.node
            arch: x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            node_file: marketdata-js.darwin-arm64.node
            arch: arm64
          # Linux targets link against glibc 2.17 with cargo-zigbuild, the
          # same baseline as the manylinux2014 wheels. napi-rs's own
          # --use-napi-cross toolchain ships a GCC too old for ring's aarch64
          # assembly ("ARM assembler must define __ARM_ARCH").
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            node_file: marketdata-js.linux-x64-gnu.node
            arch: x86-64
            zig: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            node_file: marketdata-js.linux-arm64-gnu.node
            arch: aarch64
            zig: true
          # Linux musl (Alpine). zig links against its bundled musl; the
          # addon must link libc dynamically (-crt-static, see the build
          # step) so it shares Node's libc instead of carrying its own.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            node_file: marketdata-js.linux-x64-musl.node
            arch: x86-64
            zig: true
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            node_file: marketdata-js.linux-arm64-musl.node
            arch: aarch64
            zig: true
            musl: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            node_file: marketdata-js.win32-x64-msvc.node

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: nodejs-release-${{ matrix.target }}

      - name: Install npm dependencies
        working-directory: js
        run: npm ci

      - name: Install cargo-zigbuild
        if: matrix.zig
        run: pip install --user cargo-zigbuild==0.23.4 ziglang==0.15.1

      # Call napi directly: `npm run build -- --target X` appended the flag to
      # the end of the build script (after `&& node scripts/postbuild.js`), so
      # napi never saw it and every job built for its own host.
      - name: Build native addon (napi)
        if: ${{ !matrix.zig }}
        working-directory: js
        shell: bash
        run: npx napi build -p marketdata-js --platform --release --target ${{ matrix.target }}

      # Only the .node binary is needed from these jobs; the JS loader and
      # typings are committed. napi_build::setup() adds nothing on Linux.
      - name: Build native addon (cargo-zigbuild, glibc 2.17 / musl)
        if: matrix.zig
        shell: bash
        # Empty on the glibc rows. Any RUSTFLAGS, even empty, overrides
        # build.rustflags from a .cargo/config.toml (the repo has none).
        env:
          RUSTFLAGS: ${{ matrix.musl && '-C target-feature=-crt-static' || '' }}
        run: |
          # glibc targets take a version suffix; musl targets have none.
          ZIG_TARGET=${{ matrix.target }}${{ !matrix.musl && '.2.17' || '' }}
          cargo zigbuild --release -p marketdata-js --target "$ZIG_TARGET"
          cp target/${{ matrix.target }}/release/libmarketdata_js.so js/${{ matrix.node_file }}

      - name: Verify addon
        working-directory: js
        shell: bash
        run: |
          ls -la ./*.node
          count=$(find . -maxdepth 1 -name '*.node' | wc -l | tr -d ' ')
          [[ "$count" == "1" ]] || { echo "::error::expected one .node file, found $count"; exit 1; }
          [[ -f "${{ matrix.node_file }}" ]] || { echo "::error::expected ${{ matrix.node_file }}"; exit 1; }
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            desc=$(file "${{ matrix.node_file }}")
            echo "$desc"
            [[ "$desc" == *"${{ matrix.arch }}"* ]] || { echo "::error::expected ${{ matrix.arch }} binary"; exit 1; }
          fi
          if [[ "${{ matrix.musl }}" == "true" ]]; then
            # Dynamically linked against musl's libc.so, no glibc symbol versions.
            readelf -d "${{ matrix.node_file }}" | grep NEEDED
            readelf -d "${{ matrix.node_file }}" | grep -q 'NEEDED.*\[libc\.so\]' \
              || { echo "::error::expected a dynamic dependency on musl libc.so"; exit 1; }
            if readelf -V "${{ matrix.node_file }}" | grep -q 'GLIBC_'; then
              echo "::error::musl addon references glibc symbol versions"; exit 1
            fi
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            max=$(readelf -V "${{ matrix.node_file }}" | grep -o 'GLIBC_[0-9.]*' | sort -V -u | tail -1)
            echo "requires $max"
            [[ "$(printf '%s\n' "$max" GLIBC_2.17 | sort -V | tail -1)" == "GLIBC_2.17" ]] \
              || { echo "::error::requires $max, expected <= GLIBC_2.17"; exit 1; }
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: js/${{ matrix.node_file }}
          if-no-files-found: error
          retention-days: 7

  summary:
    name: Build Summary
    needs: [build, version]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Node.js Native Addon Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| macOS x64 | x86_64-apple-darwin | ${{ needs.build.result == 'success' && 'Success' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS ARM64 | aarch64-apple-darwin | ${{ needs.build.result == 'success' && 'Success' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux x64 | x86_64-unknown-linux-gnu | ${{ needs.build.result == 'success' && 'Success' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux ARM64 | aarch64-unknown-linux-gnu | ${{ needs.build.result == 'success' && 'Success' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux x64 (musl) | x86_64-unknown-linux-musl | ${{ needs.build.result == 'success' && 'Success' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux ARM64 (musl) | aarch64-unknown-linux-musl | ${{ needs.build.result == 'success' && 'Success' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows x64 | x86_64-pc-windows-msvc | ${{ needs.build.result == 'success' && 'Success' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
