[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[project]
name = "fugle-marketdata"
version = "3.0.0rc5"
description = "Fugle market data REST and WebSocket client, powered by a Rust core"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [{ name = "Fugle Team" }]
keywords = ["fugle", "marketdata", "taiwan", "stock", "futures", "options", "websocket"]
requires-python = ">=3.8"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Homepage = "https://developer.fugle.tw"
Repository = "https://github.com/fugle-dev/fugle-marketdata-sdk"
Changelog = "https://github.com/fugle-dev/fugle-marketdata-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-timeout>=2.1", "vcrpy>=6.0.0", "pytest-benchmark>=4.0.0", "pyyaml>=6.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-timeout>=2.1", "vcrpy>=6.0.0", "pytest-benchmark>=4.0.0", "pyyaml>=6.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
module-name = "fugle_marketdata.fugle_marketdata"

[tool.pytest.ini_options]
timeout = 30
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require API key)",
    "benchmark: marks tests as benchmark tests"
]

[tool.pytest-benchmark]
disable_gc = true
min_rounds = 5
warmup = true
