[package]
name = "fugle-marketdata-core"
version = "0.8.0-rc.1"
edition.workspace = true
rust-version = "1.82"
license.workspace = true
description = "Internal kernel for the Fugle market data SDK. End users should depend on `fugle-marketdata` instead."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["fugle", "marketdata", "internal", "kernel"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "marketdata_core"

[features]
default = []
# Async client (tokio + tokio-tungstenite). Off by default — sync-first per
# the redis-rs pattern. Reserved namespace for future runtimes:
#   async-std-comp, smol-comp (not implemented in 0.3.0).
tokio-comp = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
# Opt-in `tracing` integration. Off by default — adds no dependency weight
# for consumers who do not install a `tracing_subscriber`. Enables hot-path
# `debug!`, lifecycle `info!`/`warn!`, error `warn!`/`error!`, and
# `#[tracing::instrument]` on cold-path operations (connect, subscribe,
# unsubscribe, disconnect).
tracing = ["dep:tracing"]
# Opt-in mock WebSocket server (`core::testing::MockWsServer`) for
# downstream test crates — monitor, py / js / uniffi binding test suites.
# Off by default; pulls tokio-comp transitively because the mock is
# async-only (building a sync mock would force tokio-runtime construction
# anyway). Consumers depend on it as a dev-dependency:
#   [dev-dependencies]
#   fugle-marketdata-core = { version = "0.7", features = ["test-utils"] }
test-utils = ["tokio-comp"]
# Opt-in `metrics`-crate integration. Off by default — adds no dependency
# weight for consumers who do not use the `metrics` ecosystem. When enabled,
# `WebSocketClient::new` registers `fugle_marketdata_ws_messages_dropped_total`
# and `fugle_marketdata_ws_events_dropped_total` counters, both labelled with
# `endpoint` and `client_id` (from `ConnectionConfig::client_id`). The polling
# getters (`messages_dropped_total()`, `events_dropped_total()`) remain
# available and authoritative for in-process callers regardless of this
# feature. Consumers wire their own `metrics::Recorder` (typically
# `metrics-exporter-prometheus`).
metrics = ["dep:metrics"]

[dependencies]
# Workspace-inherited dependencies (always pulled)
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
url.workspace = true

# Sync WebSocket transport. Always present — tokio-tungstenite already pulls
# in the same tungstenite 0.29 transitively, so async users pay no extra cost.
tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

# Async deps (gated behind `tokio-comp`).
tokio = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"], optional = true }
futures-util = { workspace = true, optional = true }

# Core-only dependencies (always)
ureq = { version = "2.12", default-features = false, features = ["json", "tls", "gzip"] }
# rustls pinned to ring (pure Rust crypto) to avoid aws-lc-rs pulling in C/NASM
# via feature unification. Must match ureq's "tls" feature which also uses ring.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Matches the version tokio-tungstenite's rustls-tls-native-roots feature pulls in,
# so cargo graph unifies rather than duplicating.
rustls-native-certs = "0.8"
rustls-pemfile = "2.0"
exponential-backoff = "2.0"
indexmap = "2.2"
# Path-segment escaping for symbols. Already in the graph via `url`, so this
# adds no new compilation unit.
percent-encoding = "2.3"

# Declarative builder generation. Drives builders for `ConnectionConfig`,
# `SubscribeRequest`, `RetryPolicy`, and `ReconnectionConfig`.
bon = "3"

# Optional structured-logging integration (gated behind the `tracing` feature).
tracing = { version = "0.1", optional = true }

# Optional `metrics` crate integration (gated behind the `metrics` feature).
# Pinned to ^0.24 (current stable as of 2026-05). MSRV 1.71 — well below
# core's 1.82.
metrics = { version = "0.24", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tokio-test = "0.4"
# Async features are required for the existing integration tests + benches.
tokio = { workspace = true }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util.workspace = true
# `metrics-util::debugging::DebuggingRecorder` powers the metrics smoke test
# in `core/tests/metrics_smoke.rs`. Pinned to match the `metrics` major.
metrics-util = "0.19"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
# `python` and `js` are feature flags declared on the FFI binding crates
# (py/, js/) that re-export this crate's `cfg_attr(feature = "python", ...)`
# annotations. They're not features of the core crate itself, so declare
# them here so `check-cfg` does not flag every annotation site.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("python", "js"))'] }

[[bench]]
name = "rest_latency"
harness = false

[[bench]]
name = "websocket_throughput"
harness = false

# Async; uses the aio WebSocket client gated behind `tokio-comp`. Without the
# feature cargo skips it cleanly instead of erroring on the aio import.
[[example]]
name = "prod_smoke"
required-features = ["tokio-comp"]
